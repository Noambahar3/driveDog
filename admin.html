<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive Dog | ניהול</title>
  <link rel="icon" href="/assets/drive-dog-logo.jpg">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f1eb;
      --bg-2: #e9ece6;
      --panel: #fbfaf6;
      --panel-2: #f5f2ea;
      --panel-3: #efede6;
      --ink: #17212b;
      --muted: #657070;
      --line: #ddd8cc;
      --brand: #14293f;
      --brand-2: #1e2a2a;
      --accent: #c9a227;
      --accent-soft: #f5ecd0;
      --sidebar: #14293f;
      --paid-bg: #eaf3de;
      --paid-text: #27500a;
      --unpaid-bg: #faece7;
      --unpaid-text: #712b13;
      --neutral-bg: #eef0ec;
      --neutral-text: #3c4847;
      --danger: #873222;
      --shadow: 0 18px 44px rgba(20, 41, 63, 0.11);
      --shadow-soft: 0 8px 22px rgba(20, 41, 63, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Assistant, Heebo, Rubik, Arial, "Helvetica Neue", sans-serif;
      background:
        radial-gradient(circle at 82% -10%, rgba(201, 162, 39, 0.14), transparent 34%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--ink);
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(230px, 252px) 1fr;
    }

    .menu-toggle,
    .sidebar-backdrop,
    .bottom-nav {
      display: none;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 16px;
      background:
        linear-gradient(180deg, rgba(30, 42, 42, 0.92), rgba(20, 41, 63, 1)),
        var(--sidebar);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: -1px 0 0 rgba(255, 255, 255, 0.08) inset;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      font-weight: 800;
      font-size: 18px;
      color: #ffffff;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      flex: 0 0 auto;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
    }

    .brand-name {
      display: grid;
      gap: 2px;
      line-height: 1.05;
    }

    .brand-name strong {
      color: #ffffff;
      font-size: 18px;
    }

    .brand-name span {
      color: rgba(255, 255, 255, 0.66);
      font-size: 12px;
      font-weight: 700;
    }

    .sidebar-close {
      display: none;
      margin-inline-start: auto;
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 22px;
      line-height: 1;
    }

    nav {
      display: grid;
      gap: 8px;
    }

    .nav-button {
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 7px;
      text-align: right;
      color: rgba(255, 255, 255, 0.72);
      background: transparent;
      border: 1px solid transparent;
      border-inline-end: 3px solid transparent;
      font-weight: 700;
    }

    .nav-button.active,
    .nav-button:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.08);
      border-inline-end-color: var(--accent);
    }

    .side-note {
      margin-top: auto;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 13px;
    }

    main {
      padding: 24px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .header-logo {
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      padding: 5px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }

    .page-title-copy {
      min-width: 0;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .button {
      min-height: 38px;
      padding: 9px 12px;
      border-radius: 7px;
      background: #ece8dc;
      color: var(--ink);
      font-weight: 700;
      white-space: nowrap;
    }

    .button.primary {
      background: var(--brand);
      color: #ffffff;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.14);
    }

    .button.primary:hover {
      background: var(--brand-2);
      color: #ffffff;
    }
    .button.danger { color: #ffffff; background: var(--danger); }
    .button.ghost { background: transparent; border: 1px solid var(--line); }
    .button.ghost:hover,
    .mini:hover {
      border-color: rgba(201, 162, 39, 0.62);
      background: var(--accent-soft);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 14px;
    }

    .metric,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      position: relative;
      padding: 15px;
      min-height: 96px;
      overflow: hidden;
      background: linear-gradient(180deg, #fffefa, var(--panel));
      border-inline-start: 4px solid var(--accent);
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
    }

    .dashboard-hero {
      margin-bottom: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(251, 250, 246, 0.96), rgba(234, 239, 232, 0.92)),
        linear-gradient(135deg, rgba(20, 41, 63, 0.08), rgba(201, 162, 39, 0.11));
      box-shadow: var(--shadow);
    }

    .dashboard-hero .panel-head {
      margin-bottom: 0;
      align-items: flex-start;
    }

    .dashboard-hero h2 {
      font-size: 22px;
    }

    .dashboard-hero p {
      max-width: 720px;
      margin: 6px 0 0;
      color: var(--muted);
    }

    .month-select {
      width: auto;
      min-width: 156px;
      background: #ffffff;
      font-weight: 700;
    }

    .metric.debt {
      border-inline-start-color: #b57964;
      background: linear-gradient(180deg, #fffefa, var(--unpaid-bg));
    }

    .metric.success {
      border-inline-start-color: #80a762;
      background: linear-gradient(180deg, #fffefa, var(--paid-bg));
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 14px;
      align-items: start;
    }

    .dashboard-stack {
      display: grid;
      gap: 14px;
    }

    .income-card {
      display: grid;
      grid-template-columns: minmax(190px, 0.8fr) minmax(0, 1fr);
      gap: 16px;
      align-items: center;
    }

    .pie {
      width: min(220px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--brand) 0deg, var(--brand) 360deg);
      box-shadow: inset 0 0 0 18px rgba(255, 255, 255, 0.82), 0 10px 24px rgba(20, 41, 63, 0.12);
    }

    .legend {
      display: grid;
      gap: 9px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .dashboard-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .dashboard-filters .mini.active {
      border-color: var(--accent);
      background: var(--brand);
      color: #ffffff;
    }

    .dashboard-filters select {
      width: auto;
      min-width: 158px;
    }

    .order-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .order-card.attention {
      border-color: #e4beb1;
      background: var(--unpaid-bg);
    }

    .order-card-head,
    .order-card-foot {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .order-card-foot {
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .amount-strong {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }

    .panel {
      padding: 16px;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      gap: 14px;
      align-items: start;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d5d0c4;
      border-radius: 7px;
      padding: 9px 10px;
      background: #ffffff;
      color: var(--ink);
    }

    a {
      color: var(--brand);
      font-weight: 700;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(201, 162, 39, 0.24);
      border-color: var(--accent);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      background: var(--panel-2);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini {
      min-height: 30px;
      padding: 6px 9px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--panel-3);
      color: var(--ink);
      font-weight: 700;
      font-size: 12px;
    }

    .mini.danger {
      background: var(--unpaid-bg);
      color: var(--danger);
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--neutral-bg);
      color: var(--neutral-text);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.ok { background: var(--paid-bg); color: var(--paid-text); }
    .status.warn { background: var(--unpaid-bg); color: var(--unpaid-text); }
    .status.danger { background: var(--unpaid-bg); color: var(--danger); }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .order-builder {
      display: grid;
      gap: 10px;
    }

    .item-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px 42px;
      gap: 8px;
      align-items: end;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-weight: 800;
      font-size: 18px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .delivery-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      overflow-wrap: anywhere;
    }

    .delivery-card.cash {
      border-color: #e4beb1;
      background: var(--unpaid-bg);
    }

    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    .hidden { display: none !important; }
    .break-word { overflow-wrap: anywhere; }

    .profile-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.45fr);
      gap: 14px;
      align-items: start;
    }

    .profile-stack {
      display: grid;
      gap: 14px;
    }

    .detail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .detail-list div {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      overflow-wrap: anywhere;
    }

    .detail-list span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(53, 23, 4, 0.48);
      z-index: 20;
    }

    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .toast {
      position: fixed;
      left: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100% - 36px));
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--sidebar);
      color: #ffffff;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
      body.menu-open { overflow: hidden; }
      .menu-toggle {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 31;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: var(--brand);
        color: #ffffff;
        box-shadow: var(--shadow);
        font-size: 24px;
        line-height: 1;
      }
      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        z-index: 29;
        background: rgba(20, 41, 63, 0.46);
      }
      body.menu-open .sidebar-backdrop { display: block; }
      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        width: min(82vw, 320px);
        height: 100dvh;
        transform: translateX(105%);
        transition: transform 180ms ease;
        box-shadow: -16px 0 34px rgba(20, 41, 63, 0.24);
      }
      body.menu-open .sidebar { transform: translateX(0); }
      .brand-logo {
        width: 58px;
        height: 58px;
      }
      .sidebar-close { display: grid; place-items: center; }
      nav {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      .side-note { display: none; }
      .bottom-nav {
        position: fixed;
        right: 0;
        left: 0;
        bottom: 0;
        z-index: 25;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        background: rgba(251, 250, 246, 0.96);
        border-top: 1px solid var(--line);
        box-shadow: 0 -10px 26px rgba(20, 41, 63, 0.12);
        backdrop-filter: blur(12px);
      }
      .bottom-nav-button {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 48px;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
      }
      .bottom-nav-button::before {
        content: attr(data-icon);
        font-size: 20px;
        line-height: 1;
      }
      .bottom-nav-button.active {
        color: var(--brand);
        background: #ffffff;
        box-shadow: var(--shadow-soft);
      }
      .bottom-nav-button.active::after {
        content: "";
        position: absolute;
        right: 50%;
        bottom: 5px;
        width: 22px;
        height: 3px;
        border-radius: 999px;
        background: var(--accent);
        transform: translateX(50%);
      }
      main { padding-top: 72px; padding-bottom: 86px; }
      .split,
      .profile-grid,
      .dashboard-layout,
      .filters {
        grid-template-columns: 1fr;
      }
      .income-card {
        grid-template-columns: 1fr;
      }
      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .metric {
        min-height: 118px;
        padding: 14px;
      }
      .metric strong {
        font-size: 25px;
      }
      .pie {
        display: none;
      }
      .customer-table {
        min-width: 0;
      }
      .customer-table,
      .delivery-table,
      .customer-table thead,
      .delivery-table thead,
      .customer-table tbody,
      .delivery-table tbody,
      .customer-table tr,
      .delivery-table tr,
      .customer-table td,
      .delivery-table td {
        display: block;
        width: 100%;
      }
      .customer-table thead,
      .delivery-table thead {
        display: none;
      }
      .customer-table tr,
      .delivery-table tr {
        padding: 12px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }
      .customer-table td,
      .delivery-table td {
        display: grid;
        grid-template-columns: minmax(78px, 0.36fr) minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 8px 0;
        border-bottom: 0;
      }
      .customer-table td::before,
      .delivery-table td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .customer-table td:first-child,
      .delivery-table td:first-child {
        display: block;
        padding-top: 0;
      }
      .customer-table td:first-child::before,
      .delivery-table td:first-child::before {
        content: none;
      }
      .customer-table .row-actions,
      .delivery-table .row-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .customer-table .mini,
      .delivery-table .mini {
        min-height: 44px;
      }
      .dashboard-hero .panel-head,
      .order-card-head,
      .order-card-foot {
        display: grid;
      }
      .topbar {
        display: grid;
      }
      .page-heading {
        padding-inline-start: 52px;
      }
      .toolbar {
        justify-content: stretch;
      }
      .toolbar .button {
        flex: 1;
        min-height: 44px;
      }
      button,
      input,
      select,
      textarea,
      .mini,
      .button {
        min-height: 44px;
      }
    }

    @media (max-width: 620px) {
      main { padding: 66px 14px 14px; }
      .metrics {
        gap: 10px;
      }
      .metric {
        min-height: 108px;
      }
      .metric span {
        font-size: 12px;
      }
      .metric strong {
        font-size: 23px;
      }
      .topbar { gap: 12px; }
      .header-logo {
        width: 48px;
        height: 48px;
      }
      h1 { font-size: 22px; }
      .form-grid,
      .detail-list,
      .item-row {
        grid-template-columns: 1fr;
      }
      .item-row .mini {
        min-height: 36px;
      }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle" type="button" aria-label="פתיחת תפריט" aria-controls="sidebar" aria-expanded="false">☰</button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/assets/drive-dog-logo.jpg" alt="Drive Dog">
        <span class="brand-name"><strong>דרייב דוג</strong><span>Drive Dog</span></span>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="סגירת תפריט">×</button>
      </div>
      <nav id="nav"></nav>
      <div class="side-note">MVP פנימי: הדאטה נשמר בדפדפן בלבד. Grow / משולם מסומן כ-stub ולא מחייב בפועל.</div>
    </aside>
    <main>

  <script>

    const mobilePrimaryTabs = ['dashboard', 'customers', 'orders', 'deliveries'];

    const seed = {

        { id: 'c2', name: 'דנה לוי', phone: '052-2222222', address: 'הגפן 8', city: 'רחובות', area: 'שפלה', deliveryNotes: 'להשאיר ליד הדלת', internalNotes: 'משלמת אונליין', active: true },
        { id: 'c3', name: 'יוסי מזרחי', phone: '054-3333333', address: 'העצמאות 40', city: 'אשדוד', area: 'דרום', deliveryNotes: 'כלב גדול בחצר', internalNotes: 'מזומן לשליח', active: true }
      ],
      products: [
        { id: 'p1', stage: 'בוגר', flavor: 'כבש', weightKg: 12, name: 'Brit Care כבש ואורז 12 ק"ג', basePrice: 279, notes: 'שק קבוע ללקוחות שמעדיפים כבש ואורז', active: true },
        { id: 'p2', stage: 'גור', flavor: 'עוף', weightKg: 12, name: 'Monge גור עוף 12 ק"ג', basePrice: 295, notes: '', active: true },
        { id: 'p3', stage: 'בוגר', flavor: 'עוף', weightKg: 11.4, name: 'Acana Classic עוף 11.4 ק"ג', basePrice: 349, notes: '', active: true },
        { id: 'p4', stage: 'מבוגר', flavor: 'עוף', weightKg: 4, name: 'Royal Canin Senior 4 ק"ג', basePrice: 189, notes: 'שק קטן ללקוחות עם כלבים מבוגרים', active: true },
        { id: 'p5', stage: 'מזון רגיש', flavor: 'דגים', weightKg: 10, name: 'Josera Sensitive דגים 10 ק"ג', basePrice: 265, notes: 'מתאים ללקוחות שמבקשים מזון עדין יותר', active: true }
      ],

        { id: 'cp2', customerId: 'c2', productId: 'p4', customPrice: 0, discountPercent: 8, notes: 'הנחת לקוחה קבועה' }
      ],
      invoices: [
        { id: 'inv1', customerId: 'c1', invoiceNumber: 'DD-1001', date: '2026-07-22', amount: 259, paymentStatus: 'paid_online', link: 'https://pay.example.test/invoices/DD-1001' },
        { id: 'inv2', customerId: 'c2', invoiceNumber: 'DD-1002', date: '2026-07-21', amount: 348, paymentStatus: 'paid_online', link: 'https://pay.example.test/invoices/DD-1002' }
      ],
      orders: [
        { id: 'o1001', customerId: 'c1', createdAt: '2026-07-22', deliveryDate: '2026-07-27', status: 'new', paymentStatus: 'pending_online_payment', source: 'manual', paymentUrl: 'https://pay.example.test/orders/o1001', notes: 'צריך לספק השבוע, הלקוח עוד לא שילם', items: [{ productId: 'p1', quantity: 1, unitPrice: 259 }] },
        { id: 'o1002', customerId: 'c2', createdAt: '2026-07-21', deliveryDate: '2026-07-28', status: 'confirmed', paymentStatus: 'paid_online', source: 'manual', paymentUrl: 'https://pay.example.test/orders/o1002', notes: 'שולם מראש, ממתין לאספקה', items: [{ productId: 'p4', quantity: 2, unitPrice: 174 }] },
        { id: 'o1003', customerId: 'c3', createdAt: '2026-07-20', deliveryDate: '2026-07-26', status: 'confirmed', paymentStatus: 'cash_on_delivery', source: 'manual', paymentUrl: '', notes: 'מזומן לשליח', items: [{ productId: 'p3', quantity: 1, unitPrice: 349 }] },
        { id: 'o1004', customerId: 'c1', createdAt: '2026-07-18', deliveryDate: '2026-07-23', status: 'delivered', paymentStatus: 'paid_cash', source: 'manual', paymentUrl: '', notes: 'שולם במזומן בזמן אספקה', items: [{ productId: 'p2', quantity: 1, unitPrice: 295 }] },
        { id: 'o1005', customerId: 'c2', createdAt: '2026-07-15', deliveryDate: '2026-07-22', status: 'delivered', paymentStatus: 'paid_online', source: 'manual', paymentUrl: 'https://pay.example.test/orders/o1005', notes: 'שולם אונליין', items: [{ productId: 'p5', quantity: 1, unitPrice: 244 }] },
        { id: 'o1006', customerId: 'c3', createdAt: '2026-07-12', deliveryDate: '2026-07-21', status: 'delivered', paymentStatus: 'cash_on_delivery', source: 'manual', paymentUrl: '', notes: 'סופק, הלקוח ביקש לשלם בהמשך', items: [{ productId: 'p3', quantity: 1, unitPrice: 349 }] },
        { id: 'o1007', customerId: 'c1', createdAt: '2026-07-08', deliveryDate: '2026-07-19', status: 'delivered', paymentStatus: 'paid_online', source: 'manual', paymentUrl: 'https://pay.example.test/orders/o1007', notes: '', items: [{ productId: 'p1', quantity: 1, unitPrice: 259 }] },
        { id: 'o1008', customerId: 'c2', createdAt: '2026-07-05', deliveryDate: '2026-07-16', status: 'delivered', paymentStatus: 'paid_cash', source: 'manual', paymentUrl: '', notes: '', items: [{ productId: 'p4', quantity: 1, unitPrice: 174 }] },
        { id: 'o1009', customerId: 'c3', createdAt: '2026-06-26', deliveryDate: '2026-06-30', status: 'delivered', paymentStatus: 'paid_online', source: 'manual', paymentUrl: 'https://pay.example.test/orders/o1009', notes: '', items: [{ productId: 'p3', quantity: 1, unitPrice: 349 }] },
        { id: 'o1010', customerId: 'c1', createdAt: '2026-06-18', deliveryDate: '2026-06-22', status: 'delivered', paymentStatus: 'cash_on_delivery', source: 'manual', paymentUrl: '', notes: 'סופק ביוני, עדיין לא שולם', items: [{ productId: 'p2', quantity: 1, unitPrice: 295 }] },
        { id: 'o1011', customerId: 'c2', createdAt: '2026-08-02', deliveryDate: '2026-08-06', status: 'delivered', paymentStatus: 'paid_online', source: 'manual', paymentUrl: 'https://pay.example.test/orders/o1011', notes: 'דוגמת אוגוסט', items: [{ productId: 'p5', quantity: 2, unitPrice: 244 }] }
      ],
      selected: { customerId: 'c1', customerProfileId: 'c1', productId: 'p1' }
    };

    let state = loadState();
    let currentTab = 'dashboard';
    let customersLoadState = 'loading';
    let customersLoadError = '';
    let deletedCustomersLoadState = 'idle';
    let deletedCustomersLoadError = '';
    let deletedCustomers = [];
    let customersSaving = false;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return clone(seed);
      try {
        return { ...clone(seed), ...JSON.parse(raw) };
      } catch {
        return clone(seed);
      }
    }

    function saveState(message) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (message) toast(message);
      render();
    }

    async function loadCustomersFromServer() {
      customersLoadState = 'loading';
      customersLoadError = '';
      render();
      try {
        const response = await fetch('/api/customers');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'טעינת הלקוחות נכשלה');
        state.customers = data.customers.map(normalizeCustomer);
        customersLoadState = 'ready';
      } catch (error) {
        customersLoadState = 'error';
        customersLoadError = error.message || 'טעינת הלקוחות נכשלה';
      }
      render();
    }

    async function loadDeletedCustomersFromServer() {
      deletedCustomersLoadState = 'loading';
      deletedCustomersLoadError = '';
      render();
      try {
        const response = await fetch('/api/customers/deleted');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'טעינת ארכיון הלקוחות נכשלה');
        deletedCustomers = data.customers.map(normalizeCustomer);
        deletedCustomersLoadState = 'ready';
      } catch (error) {
        deletedCustomersLoadState = 'error';
        deletedCustomersLoadError = error.message || 'טעינת ארכיון הלקוחות נכשלה';
      }
      render();
    }

    async function customerApi(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'content-type': 'application/json',
          ...(options.headers || {})
        }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'פעולת הלקוח נכשלה');
      return data;
    }

    function normalizeCustomer(item) {
      const firstName = item.firstName || String(item.name || '').trim().split(/\s+/)[0] || '';
      const lastName = item.lastName || String(item.name || '').trim().split(/\s+/).slice(1).join(' ');
      return {
        ...item,
        firstName,
        lastName,
        name: [firstName, lastName].filter(Boolean).join(' '),
        active: item.active !== false
      };
    }

    function shekel(value) {
      return new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 }).format(value || 0);
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function nextId(prefix, list) {
      return prefix + (Date.now().toString(36) + list.length.toString(36));
    }

    function customer(id) {
      return state.customers.find((item) => item.id === id);
    }

    function customerName(item) {
      if (!item) return '-';
      return [item.firstName, item.lastName].filter(Boolean).join(' ') || item.name || '-';
    }

    function product(id) {
      return state.products.find((item) => item.id === id);
    }

    function productName(item) {
      return item?.name || item?.bagName || '-';
    }

    function orderTotal(order) {
      return order.items.reduce((sum, item) => sum + Number(item.quantity || 0) * Number(item.unitPrice || 0), 0);
    }

    function customerMetrics(customerId) {
      const orders = customerOrders(customerId);
      const total = orders.reduce((sum, order) => sum + orderTotal(order), 0);
      const lastOrderDate = orders.map((order) => order.createdAt || order.deliveryDate || '').sort().at(-1) || '';
      return {
        orderCount: orders.length,
        total,
        averageOrder: orders.length ? Math.round(total / orders.length) : 0,
        lastOrderDate
      };
    }

    function customerOrders(customerId) {
      return state.orders.filter((order) => order.customerId === customerId);
    }

    function customerInvoices(customerId) {
      return (state.invoices || []).filter((invoice) => invoice.customerId === customerId);
    }

    function customerPrices(customerId) {
      return state.prices.filter((price) => price.customerId === customerId);
    }

    function priceFor(customerId, productId) {
      const base = product(productId)?.basePrice || 0;
      const override = state.prices.find((item) => item.customerId === customerId && item.productId === productId);
      if (!override) return base;
      const custom = Number(override.customPrice || 0);
      const start = custom > 0 ? custom : base;
      return Math.round(start * (1 - Number(override.discountPercent || 0) / 100));
    }

    function statusLabel(value) {
      const labels = {
        new: 'חדשה',
        confirmed: 'מאושרת',
        delivered: 'סופקה',
        cancelled: 'בוטלה',
        awaiting_delivery: 'ממתין לאספקה',
        paid_awaiting_delivery: 'שולם - ממתין לאספקה',
        delivered_unpaid: 'סופק - לא שולם',
        delivered_paid: 'סופק ושולם',
        pending_online_payment: 'ממתין לתשלום',
        cash_on_delivery: 'מזומן לשליח',
        paid_cash: 'שולם במזומן',
        paid_online: 'שולם אונליין',
        failed: 'נכשל'
      };
      return labels[value] || value;
    }

    function statusClass(value) {
      if (['paid_online', 'paid_cash', 'delivered', 'confirmed', 'delivered_paid', 'paid_awaiting_delivery'].includes(value)) return 'ok';
      if (['cash_on_delivery', 'pending_online_payment', 'new', 'awaiting_delivery', 'delivered_unpaid'].includes(value)) return 'warn';
      if (['failed', 'cancelled'].includes(value)) return 'danger';
      return '';
    }

    function isPaid(order) {
      return ['paid_online', 'paid_cash'].includes(order.paymentStatus);
    }

    function isDelivered(order) {
      return order.status === 'delivered';
    }

    function dashboardStatus(order) {
      if (isDelivered(order) && isPaid(order)) return 'delivered_paid';
      if (isDelivered(order) && !isPaid(order)) return 'delivered_unpaid';
      if (!isDelivered(order) && isPaid(order)) return 'paid_awaiting_delivery';
      return 'awaiting_delivery';
    }

    function incomeCategory(order) {
      if (order.paymentStatus === 'paid_online') return 'paid_online';
      if (order.paymentStatus === 'paid_cash') return 'paid_cash';
      if (isDelivered(order) && !isPaid(order)) return 'delivered_unpaid';
      return '';
    }

    function incomeOrdersForMonth(monthKeyValue) {
      return state.orders.filter((order) => {
        const category = incomeCategory(order);
        return category && orderMonthKey(order) === monthKeyValue;
      });
    }

    function orderMonthKey(order) {
      return String(order.deliveryDate || order.createdAt || '').slice(0, 7);
    }

    function monthLabel(monthKeyValue) {
      if (!monthKeyValue) return 'החודש';
      const [year, month] = monthKeyValue.split('-').map(Number);
      return new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' }).format(new Date(year, month - 1, 1));
    }

    function availableIncomeMonths() {
      const months = Array.from(new Set(state.orders.map(orderMonthKey).filter(Boolean))).sort();
      return months.length ? months : [today().slice(0, 7)];
    }

    function monthOptions(selectedMonth) {
      return availableIncomeMonths().map((month) => `<option value="${month}" ${month === selectedMonth ? 'selected' : ''}>${monthLabel(month)}</option>`).join('');
    }

    function cssColor(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function toast(message) {
      const node = document.getElementById('toast');
      node.textContent = message;
      node.classList.remove('hidden');
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => node.classList.add('hidden'), 2400);
    }

    function setMenuOpen(open) {
      document.body.classList.toggle('menu-open', open);
      document.getElementById('menuToggle').setAttribute('aria-expanded', String(open));
    }

    function bindShell() {
      document.getElementById('menuToggle').addEventListener('click', () => setMenuOpen(!document.body.classList.contains('menu-open')));
      document.getElementById('sidebarClose').addEventListener('click', () => setMenuOpen(false));
      document.getElementById('sidebarBackdrop').addEventListener('click', () => setMenuOpen(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') setMenuOpen(false);
      });
    }

    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = tabs.map(([id, label]) => `<button class="nav-button ${id === currentTab ? 'active' : ''}" data-tab="${id}" type="button">${label}</button>`).join('');
      nav.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          currentTab = button.dataset.tab;
          setMenuOpen(false);
          if (currentTab === 'deletedCustomers' && deletedCustomersLoadState === 'idle') loadDeletedCustomersFromServer();
          render();
        });
      });
      renderBottomNav();
    }

    function renderBottomNav() {
      const bottomNav = document.getElementById('bottomNav');
      bottomNav.innerHTML = mobilePrimaryTabs.map((id) => {
        const meta = tabs.find(([tabId]) => tabId === id);
        const label = meta?.[1] || id;
        return `<button class="bottom-nav-button ${id === currentTab ? 'active' : ''}" data-tab="${id}" data-icon="${tabIcons[id] || '•'}" type="button" aria-label="${label}" title="${label}"></button>`;
      }).join('');
      bottomNav.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          currentTab = button.dataset.tab;
          setMenuOpen(false);
          render();
        });
      });
    }

    function render() {
      renderNav();
      const views = {
        dashboard: dashboardView,
        customers: customersView,
        deletedCustomers: deletedCustomersView,
        customerProfile: customerProfileView,
        products: productsView,
        pricing: pricingView,
        orders: ordersView,
        deliveries: deliveriesView,
        settings: settingsView
      };
      const tabMeta = tabs.find(([id]) => id === currentTab);
      const profileCustomer = customer(state.selected.customerProfileId);
      const title = currentTab === 'customerProfile' ? customerName(profileCustomer) : tabMeta?.[1] || 'Drive Dog';
      const subtitle = currentTab === 'customerProfile' ? 'פרופיל לקוח: פרטים, הזמנות, חשבוניות, מדדים ואיפוס סיסמה.' : tabMeta?.[2] || '';
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageSubtitle').textContent = subtitle;
      const view = document.getElementById('view');
      view.innerHTML = views[currentTab]();
      bindView();
    }

    function dashboardView() {
      const months = availableIncomeMonths();
      const selectedMonth = state.selected.dashboardMonth || months.at(-1);
      state.selected.dashboardMonth = selectedMonth;
      const openOrders = state.orders.filter((order) => !isDelivered(order) && order.status !== 'cancelled');
      const deliveredRecent = state.orders.filter(isDelivered).sort((a, b) => (b.deliveryDate || '').localeCompare(a.deliveryDate || '')).slice(0, 10);
      const unpaidDelivered = state.orders.filter((order) => dashboardStatus(order) === 'delivered_unpaid');
      const incomeOrders = incomeOrdersForMonth(selectedMonth);
      const incomeTotal = incomeOrders.reduce((sum, order) => sum + orderTotal(order), 0);
      const paidTotal = incomeOrders.filter(isPaid).reduce((sum, order) => sum + orderTotal(order), 0);
      const debtTotal = unpaidDelivered.reduce((sum, order) => sum + orderTotal(order), 0);
      return `
        <div class="dashboard-hero">
          <div class="panel-head">
            <div>
              <h2>תמונת מצב ניהולית</h2>
              <p>מבט מהיר על אספקות שצריך לבצע, כסף שכבר נכנס, וחוב שנוצר מלקוחות שקיבלו מזון ועדיין לא שילמו.</p>
            </div>
            <select class="month-select" id="dashboardMonth" aria-label="בחירת חודש">${monthOptions(selectedMonth)}</select>
          </div>
        </div>
        <div class="grid metrics">
          <div class="metric"><span>הזמנות פתוחות לאספקה</span><strong>${openOrders.length}</strong></div>
          <div class="metric success"><span>שולם החודש</span><strong>${shekel(paidTotal)}</strong></div>
          <div class="metric debt"><span>סופק ולא שולם</span><strong>${shekel(debtTotal)}</strong></div>
          <div class="metric"><span>סופקו לאחרונה</span><strong>${deliveredRecent.length}</strong></div>
        </div>
        <div class="dashboard-layout">
          <div class="dashboard-stack">
            <div class="panel">
              <div class="panel-head"><h2>הכנסה חודשית | ${monthLabel(selectedMonth)}</h2><strong class="amount-strong">${shekel(incomeTotal)}</strong></div>
              ${incomeBreakdown(incomeOrders)}
            </div>
            <div class="panel">
              <div class="panel-head">
                <h2>הזמנות פתוחות שצריך לספק</h2>
                <div class="dashboard-filters">
                  <button class="mini active" data-dashboard-filter="all" type="button">הכל</button>
                  <button class="mini" data-dashboard-filter="unpaid" type="button">לא שולם</button>
                  <button class="mini" data-dashboard-filter="paid" type="button">שולם</button>
                  <button class="mini" data-dashboard-filter="soon" type="button">היום/קרוב</button>
                  <select id="dashboardSort" aria-label="מיון הזמנות פתוחות">
                    <option value="date">מיון לפי אספקה</option>
                    <option value="amount">מיון לפי סכום</option>
                  </select>
                </div>
              </div>
              <div class="list" id="dashboardOpenOrders">${dashboardOrderCards(openOrders, { compact: false })}</div>
            </div>
          </div>
          <div class="dashboard-stack">
            <div class="panel">
              <div class="panel-head"><h2>סופקו לאחרונה</h2><span class="status warn">${unpaidDelivered.length} לא שולמו</span></div>
              <div class="list">${dashboardOrderCards(deliveredRecent, { compact: true })}</div>
            </div>
            <div class="panel">
              <div class="panel-head"><h2>חוב לפי לקוח</h2></div>
              ${customerDebtList(unpaidDelivered)}
            </div>
          </div>
        </div>`;
    }

    function incomeBreakdown(rows) {
      const categories = [
        ['paid_online', 'שולם אונליין', '#14293F'],
        ['paid_cash', 'שולם מזומן', '#6E8B58'],
        ['delivered_unpaid', 'סופק ולא שולם', '#B57964']
      ];
      const totals = categories.map(([key, label, color]) => ({
        key,
        label,
        color,
        total: rows.filter((order) => incomeCategory(order) === key).reduce((sum, order) => sum + orderTotal(order), 0)
      }));
      const total = totals.reduce((sum, item) => sum + item.total, 0);
      let cursor = 0;
      const segments = totals.map((item) => {
        const start = cursor;
        const size = total ? (item.total / total) * 360 : 0;
        cursor += size;
        return `${item.color} ${start}deg ${cursor}deg`;
      }).filter(Boolean).join(', ');
      const pieStyle = segments ? `style="background: conic-gradient(${segments});"` : '';
      return `
        <div class="income-card">
          <div class="pie" ${pieStyle} aria-label="גרף הכנסה חודשית"></div>
          <div class="legend">
            ${totals.map((item) => `
              <div class="legend-row">
                <span class="legend-swatch" style="background:${item.color}"></span>
                <span>${item.label}</span>
                <strong>${shekel(item.total)}</strong>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function dashboardOrderCards(rows, options = {}) {
      if (!rows.length) return '<div class="empty">אין הזמנות להצגה</div>';
      return rows.map((order) => {
        const c = customer(order.customerId);
        const status = dashboardStatus(order);
        const attention = status === 'delivered_unpaid' || (!isDelivered(order) && !isPaid(order));
        return `
          <article class="order-card ${attention ? 'attention' : ''}">
            <div class="order-card-head">

                <div class="muted">${c?.city || '-'} · ${order.deliveryDate || 'ללא תאריך'}</div>

            ${options.compact ? '' : `<div class="muted">${order.items.map((item) => `${productName(product(item.productId))} × ${item.quantity}`).join('<br>')}</div>`}
            <div class="order-card-foot">
              <span>${order.notes || order.id}</span>

      }).join('');

    function customerDebtList(rows) {
      if (!rows.length) return '<div class="empty">אין חוב פתוח כרגע</div>';
      const totals = rows.reduce((map, order) => {
        const current = map.get(order.customerId) || { customerId: order.customerId, count: 0, total: 0 };
        current.count += 1;
        current.total += orderTotal(order);
        map.set(order.customerId, current);
        return map;
      }, new Map());
      const items = Array.from(totals.values()).sort((a, b) => b.total - a.total);
      return `<div class="list">${items.map((item) => `
        <div class="delivery-card cash">
          <strong>${customerName(customer(item.customerId))}</strong><br>
          <span class="muted">${item.count} הזמנות שסופקו ולא שולמו</span>

          <td data-label="פריטים">${order.items.map((item) => `${productName(product(item.productId))} × ${item.quantity}`).join('<br>')}</td>

          <td data-label="סה&quot;כ"><strong>${shekel(orderTotal(order))}</strong></td>
          <td data-label="הערות">${order.notes || c?.deliveryNotes || '<span class="muted">אין הערות</span>'}</td>
          <td data-label="פעולות"><div class="row-actions"><button class="mini" data-pay-link="${order.id}" type="button">קישור תשלום</button><button class="mini" data-mark-paid="${order.id}" type="button">סמן שולם</button><button class="mini" data-delivered="${order.id}" type="button">סופק</button></div></td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
    }

    function settingsView() {
      return `
        <div class="grid">
          <div class="panel"><div class="panel-head"><h2>סטטוסים חיצוניים</h2></div>
            <div class="grid metrics">
              <div class="metric"><span>Grow / משולם</span><strong>Stub</strong></div>
              <div class="metric"><span>לינק סיסמה ראשוני</span><strong>TBD</strong></div>
              <div class="metric"><span>ייבוא לקוחות</span><strong>TBD</strong></div>
              <div class="metric"><span>חשבוניות מזומן</span><strong>TBD</strong></div>
            </div>
          </div>
          <div class="panel"><h2>כללי אבטחה שנקבעו</h2><p class="muted">לקוחות נוצרים רק על ידי בעל העסק. בפורטל הלקוח העתידי תהיה כניסה עם טלפון וסיסמה, סיסמה זמנית/לינק ראשוני, והחלפת סיסמה חובה בכניסה הראשונה.</p></div>
        </div>`;
    }

    function field(labelText, id, type = 'text') {
      return `<div class="field"><label>${labelText}</label><input id="${id}" type="${type}"></div>`;
    }

    function fieldInput(labelText, id, type = 'text') {
      return `<label>${labelText}</label><input id="${id}" type="${type}">`;
    }

    function area(labelText, id) {
      return `<div class="field full"><label>${labelText}</label><textarea id="${id}"></textarea></div>`;
    }

    function optionSelect(id, options) {
      return `<select id="${id}">${options.map((option) => `<option value="${option}">${option}</option>`).join('')}</select>`;
    }

    function selectField(labelText, id, options) {
      return `<select id="${id}" aria-label="${labelText}">${options.map((option) => `<option value="${option}">${option || labelText}</option>`).join('')}</select>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function hiddenId(id) {
      return `<input id="${id}" type="hidden">`;
    }

    function customerSelect(id) {
      return `<select id="${id}">${state.customers.filter((item) => item.active !== false && !item.deletedAt).map((item) => `<option value="${item.id}">${customerName(item)} | ${item.phone}</option>`).join('')}</select>`;
    }

    function productSelect(id) {
      return `<select id="${id}">${state.products.filter((item) => item.active).map((item) => `<option value="${item.id}">${productName(item)} | ${shekel(item.basePrice)}</option>`).join('')}</select>`;
    }

    function bindView() {
      document.querySelectorAll('[data-goto]').forEach((button) => button.addEventListener('click', () => { currentTab = button.dataset.goto; render(); }));
      document.querySelectorAll('[data-open-customer]').forEach((button) => button.addEventListener('click', () => openCustomerProfile(button.dataset.openCustomer)));
      document.querySelectorAll('[data-open-deleted-customer]').forEach((button) => button.addEventListener('click', () => openCustomerProfile(button.dataset.openDeletedCustomer)));
      document.querySelectorAll('[data-edit-customer]').forEach((button) => button.addEventListener('click', () => editCustomer(button.dataset.editCustomer)));
      document.querySelectorAll('[data-delete-customer]').forEach((button) => button.addEventListener('click', () => deleteCustomer(button.dataset.deleteCustomer)));
      document.querySelectorAll('[data-order-customer]').forEach((button) => button.addEventListener('click', () => openOrdersForCustomer(button.dataset.orderCustomer)));
      document.querySelectorAll('[data-price-customer]').forEach((button) => button.addEventListener('click', () => openPricingForCustomer(button.dataset.priceCustomer)));
      document.querySelectorAll('[data-quick-order-customer]').forEach((button) => button.addEventListener('click', () => openQuickOrderModal(button.dataset.quickOrderCustomer)));
      document.querySelectorAll('[data-reset-password]').forEach((button) => button.addEventListener('click', () => resetCustomerPassword(button.dataset.resetPassword)));
      document.getElementById('reloadDeletedCustomers')?.addEventListener('click', loadDeletedCustomersFromServer);
      bindDashboard();
      bindCustomers();
      bindProducts();
      bindPricing();
      bindOrders();
      bindDeliveries();
    }

    function bindDashboard() {
      const monthSelect = document.getElementById('dashboardMonth');
      if (!monthSelect) return;
      monthSelect.addEventListener('change', () => {
        state.selected.dashboardMonth = monthSelect.value;
        render();
      });
      let activeFilter = 'all';
      const sortSelect = document.getElementById('dashboardSort');
      const filterButtons = Array.from(document.querySelectorAll('[data-dashboard-filter]'));
      const updateOpenOrders = () => {
        const todayValue = today();
        const nextWeek = new Date(todayValue);
        nextWeek.setDate(nextWeek.getDate() + 7);
        const nextWeekValue = nextWeek.toISOString().slice(0, 10);
        let rows = state.orders.filter((order) => !isDelivered(order) && order.status !== 'cancelled');
        rows = rows.filter((order) => {
          if (activeFilter === 'paid') return isPaid(order);
          if (activeFilter === 'unpaid') return !isPaid(order);
          if (activeFilter === 'soon') return (order.deliveryDate || '') <= nextWeekValue;
          return true;
        });
        if (sortSelect?.value === 'amount') {
          rows.sort((a, b) => orderTotal(b) - orderTotal(a));
        } else {
          rows.sort((a, b) => (a.deliveryDate || '').localeCompare(b.deliveryDate || ''));
        }
        document.getElementById('dashboardOpenOrders').innerHTML = dashboardOrderCards(rows, { compact: false });
      };
      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = button.dataset.dashboardFilter;
          filterButtons.forEach((item) => item.classList.toggle('active', item === button));
          updateOpenOrders();
        });
      });
      sortSelect?.addEventListener('change', updateOpenOrders);
    }

    function bindCustomers() {
      const form = document.getElementById('customerForm');
      if (!form) return;
      document.getElementById('reloadCustomers')?.addEventListener('click', loadCustomersFromServer);
      document.getElementById('customerSearch').addEventListener('input', (event) => {
        const q = event.target.value.trim().toLowerCase();
        const rows = state.customers.filter((item) => [customerName(item), item.address, item.phone, item.city].join(' ').toLowerCase().includes(q));
        document.querySelector('.table-wrap').innerHTML = customersListContent(rows);
        bindCustomerRows();
      });
      document.getElementById('clearCustomer').addEventListener('click', () => {
        form.reset();
        setValue('customerId', '');
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const id = document.getElementById('customerId').value;
        const item = {
          firstName: value('customerFirstName'),
          lastName: value('customerLastName'),
          phone: value('customerPhone'),
          address: value('customerAddress'),
          city: value('customerCity'),
          deliveryNotes: value('customerDeliveryNotes')
        };
        if (!item.firstName || !item.lastName || !item.phone) return toast('צריך שם פרטי, שם משפחה וטלפון');
        const saveButton = document.getElementById('saveCustomer');
        customersSaving = true;
        saveButton.disabled = true;
        saveButton.textContent = 'שומר...';
        try {
          const data = await customerApi(id ? `/api/customers/${encodeURIComponent(id)}` : '/api/customers', {
            method: id ? 'PATCH' : 'POST',
            body: JSON.stringify(item)
          });
          const savedCustomer = normalizeCustomer(data.customer);
          upsert(state.customers, savedCustomer);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          form.reset();
          setValue('customerId', '');
          toast('לקוח נשמר');
          render();
        } catch (error) {
          toast(error.message || 'שמירת הלקוח נכשלה');
        } finally {
          customersSaving = false;
          if (document.body.contains(saveButton)) {
            saveButton.disabled = false;
            saveButton.textContent = 'שמירה';
          }
        }
      });
    }

    function bindCustomerRows() {
      document.querySelectorAll('[data-open-customer]').forEach((button) => button.addEventListener('click', () => openCustomerProfile(button.dataset.openCustomer)));
      document.querySelectorAll('[data-edit-customer]').forEach((button) => button.addEventListener('click', () => editCustomer(button.dataset.editCustomer)));
      document.querySelectorAll('[data-order-customer]').forEach((button) => button.addEventListener('click', () => openOrdersForCustomer(button.dataset.orderCustomer)));
      document.querySelectorAll('[data-delete-customer]').forEach((button) => button.addEventListener('click', () => deleteCustomer(button.dataset.deleteCustomer)));
    }

    function editCustomer(id) {
      currentTab = 'customers';
      render();
      fillCustomer(id);
    }

    function fillCustomer(id) {
      const item = customer(id);
      if (!item) return;
      setValue('customerId', item.id);
      setValue('customerFirstName', item.firstName);
      setValue('customerLastName', item.lastName);
      setValue('customerPhone', item.phone);
      setValue('customerAddress', item.address);
      setValue('customerCity', item.city);
      setValue('customerDeliveryNotes', item.deliveryNotes);
    }

    async function deleteCustomer(id) {
      const item = customer(id);
      if (!item) return;
      if (!confirm(`למחוק את ${customerName(item)} ולהעביר לארכיון לקוחות מחוקים?`)) return;
      try {
        await customerApi(`/api/customers/${encodeURIComponent(id)}`, { method: 'DELETE' });
        state.customers = state.customers.filter((customerItem) => customerItem.id !== id);
        state.prices = state.prices.filter((price) => price.customerId !== id);
        if (state.selected.customerId === id) state.selected.customerId = state.customers[0]?.id || '';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        toast('הלקוח הועבר לארכיון');
        render();
      } catch (error) {
        toast(error.message || 'מחיקת הלקוח נכשלה');
      }
    }

    function openCustomerProfile(id) {
      state.selected.customerProfileId = id;
      currentTab = 'customerProfile';
      render();
    }

    function openOrdersForCustomer(id) {
      state.selected.customerId = id;
      currentTab = 'orders';
      render();
    }

    function openPricingForCustomer(id) {
      state.selected.customerId = id;
      currentTab = 'pricing';
      render();
    }

    async function resetCustomerPassword(id) {
      const item = customer(id);
      if (!item) return;
      if (!confirm(`לאפס סיסמה ל-${customerName(item)}?`)) return;
      try {
        const data = await customerApi(`/api/customers/${encodeURIComponent(id)}/reset-password`, { method: 'POST' });
        upsert(state.customers, normalizeCustomer(data.customer));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        toast('הסיסמה אופסה. הלקוח יחויב להחליף סיסמה בכניסה הבאה');
        render();
      } catch (error) {
        toast(error.message || 'איפוס הסיסמה נכשל');
      }
    }

    function openQuickOrderModal(customerId) {
      const item = customer(customerId);
      if (!item) return toast('לקוח לא נמצא');
      const root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="modal">
          <div class="panel-head"><h2>הזמנה מהירה | ${customerName(item)}</h2><button class="mini" id="closeModal" type="button">סגירה</button></div>
          <form class="order-builder" id="quickOrderForm">
            <div class="field"><label>מוצר</label>${productSelect('quickOrderProduct')}</div>
            <div class="field"><label>כמות</label><input id="quickOrderQty" type="number" min="1" value="1"></div>
            <div class="field"><label>תאריך אספקה</label><input id="quickDeliveryDate" type="date" value="${today()}"></div>
            <div class="field"><label>סטטוס תשלום</label><select id="quickPaymentStatus"><option value="pending_online_payment">ממתין לתשלום</option><option value="cash_on_delivery">מזומן לשליח</option><option value="paid_cash">שולם במזומן</option><option value="paid_online">שולם אונליין</option></select></div>
            ${area('הערות להזמנה', 'quickOrderNotes')}
            <div class="total-line"><span>סה"כ</span><span id="quickOrderTotal">₪0</span></div>
            <button class="button primary" type="submit">יצירת הזמנה</button>
          </form>
        </div>`;
      root.classList.remove('hidden');
      document.getElementById('closeModal').addEventListener('click', closeModal);
      document.getElementById('quickOrderProduct').value = state.selected.productId || state.products[0]?.id || '';
      ['quickOrderProduct', 'quickOrderQty'].forEach((id) => document.getElementById(id).addEventListener('input', () => recalcQuickOrder(customerId)));
      document.getElementById('quickOrderForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const productId = value('quickOrderProduct');
        const quantity = Number(value('quickOrderQty') || 0);
        if (!productId || quantity <= 0) return toast('צריך לבחור מוצר וכמות');
        const id = nextId('o', state.orders);
        const paymentStatus = value('quickPaymentStatus');
        state.orders.push({
          id,
          customerId,
          createdAt: today(),
          deliveryDate: value('quickDeliveryDate'),
          status: paymentStatus === 'paid_online' || paymentStatus === 'paid_cash' ? 'confirmed' : 'new',
          paymentStatus,
          source: 'manual',
          paymentUrl: paymentStatus === 'pending_online_payment' ? `https://pay.example.test/orders/${id}` : '',
          notes: value('quickOrderNotes'),
          items: [{ productId, quantity, unitPrice: priceFor(customerId, productId) }]
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        closeModal();
        toast('הזמנה מהירה נוצרה');
        render();
      });
      recalcQuickOrder(customerId);
    }

    function recalcQuickOrder(customerId) {
      const productId = value('quickOrderProduct');
      const quantity = Number(value('quickOrderQty') || 0);
      document.getElementById('quickOrderTotal').textContent = shekel(priceFor(customerId, productId) * quantity);
    }

    function closeModal() {
      const root = document.getElementById('modalRoot');
      root.classList.add('hidden');
      root.innerHTML = '';
    }

    function bindProducts() {
      const form = document.getElementById('productForm');
      if (!form) return;
      const bindProductRows = () => {
        document.querySelectorAll('[data-edit-product]').forEach((button) => button.addEventListener('click', () => fillProduct(button.dataset.editProduct)));
      };
      const filterProducts = () => {
        const q = value('productSearch').toLowerCase();
        const stage = value('productStageFilter');
        const flavor = value('productFlavorFilter');
        const rows = state.products.filter((item) => {
          const text = [productName(item), item.stage, item.flavor, item.notes, item.weightKg].join(' ').toLowerCase();
          return (!q || text.includes(q)) && (!stage || item.stage === stage) && (!flavor || item.flavor === flavor);
        });
        document.getElementById('productsTable').innerHTML = productsTable(rows);
        bindProductRows();
      };
      bindProductRows();
      ['productSearch', 'productStageFilter', 'productFlavorFilter'].forEach((id) => document.getElementById(id).addEventListener('input', filterProducts));
      document.getElementById('clearProductFilters').addEventListener('click', () => {
        setValue('productSearch', '');
        setValue('productStageFilter', '');
        setValue('productFlavorFilter', '');
        filterProducts();
      });
      document.getElementById('clearProduct').addEventListener('click', () => {
        form.reset();
        setValue('productId', '');
      });
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const id = value('productId') || nextId('p', state.products);
        const item = {
          id,
          stage: value('productStage'),
          flavor: value('productFlavor'),
          weightKg: Number(value('productWeight') || 0),
          name: value('productName'),
          basePrice: Number(value('productPrice') || 0),
          notes: value('productNotes'),
          active: value('productActive') === 'true'
        };
        if (!item.name || !item.weightKg || !item.basePrice) return toast('צריך שם שק, משקל ומחיר בסיס');
        upsert(state.products, item);
        saveState('מוצר נשמר');
      });
    }

    function fillProduct(id) {
      const item = product(id);
      if (!item) return;
      setValue('productId', item.id);
      setValue('productStage', item.stage);
      setValue('productFlavor', item.flavor);
      setValue('productWeight', item.weightKg);
      setValue('productName', productName(item));
      setValue('productPrice', item.basePrice);
      setValue('productNotes', item.notes);
      setValue('productActive', String(item.active));
    }

    function bindPricing() {
      const form = document.getElementById('priceForm');
      if (!form) return;
      const priceCustomerNode = document.getElementById('priceCustomer');
      if (state.selected.customerId) priceCustomerNode.value = state.selected.customerId;
      document.querySelectorAll('[data-delete-price]').forEach((button) => button.addEventListener('click', () => {
        state.prices = state.prices.filter((item) => item.id !== button.dataset.deletePrice);
        saveState('כלל מחיר נמחק');
      }));
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const item = {
          id: nextId('cp', state.prices),
          customerId: value('priceCustomer'),
          productId: value('priceProduct'),
          customPrice: Number(value('customPrice') || 0),
          discountPercent: Number(value('discountPercent') || 0),
          notes: value('priceNotes')
        };
        state.prices = state.prices.filter((price) => !(price.customerId === item.customerId && price.productId === item.productId));
        state.prices.push(item);
        saveState('מחיר אישי נשמר');
      });
    }

    function bindOrders() {
      const form = document.getElementById('orderForm');
      if (!form) return;
      const customerSelectNode = document.getElementById('orderCustomer');
      if (state.selected.customerId) customerSelectNode.value = state.selected.customerId;
      renderOrderItems([{ productId: state.selected.productId || state.products[0]?.id, quantity: 1 }]);
      customerSelectNode.addEventListener('change', recalcOrder);
      document.getElementById('addOrderItem').addEventListener('click', () => {
        const items = readOrderItems();
        items.push({ productId: state.products[0]?.id, quantity: 1 });
        renderOrderItems(items);
      });
      document.getElementById('clearOrderFilters').addEventListener('click', () => {
        setValue('orderPaymentFilter', '');
        setValue('orderAreaFilter', '');
        setValue('orderDateFilter', '');
        filterOrders();
      });
      ['orderPaymentFilter', 'orderAreaFilter', 'orderDateFilter'].forEach((id) => document.getElementById(id).addEventListener('input', filterOrders));
      bindOrderActionButtons();
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const customerId = value('orderCustomer');
        const items = readOrderItems().map((item) => ({ ...item, unitPrice: priceFor(customerId, item.productId) })).filter((item) => item.productId && item.quantity > 0);
        if (!items.length) return toast('צריך לפחות פריט אחד');
        const id = nextId('o', state.orders);
        const paymentStatus = value('paymentStatus');
        state.orders.push({
          id,
          customerId,
          createdAt: today(),
          deliveryDate: value('deliveryDate'),
          status: paymentStatus === 'paid_online' || paymentStatus === 'paid_cash' ? 'confirmed' : 'new',
          paymentStatus,
          source: 'manual',
          paymentUrl: paymentStatus === 'pending_online_payment' ? `https://pay.example.test/orders/${id}` : '',
          notes: value('orderNotes'),
          items
        });
        saveState('הזמנה נוצרה');
      });
    }

    function renderOrderItems(items) {
      document.getElementById('orderItems').innerHTML = items.map((item, index) => `
        <div class="item-row" data-order-row>
          <div class="field"><label>מוצר</label>${productSelect(`orderProduct${index}`)}</div>
          <div class="field"><label>כמות</label><input id="orderQty${index}" type="number" min="1" value="${item.quantity || 1}"></div>
          <button class="mini" data-remove-order-item="${index}" type="button">×</button>
        </div>`).join('');
      items.forEach((item, index) => {
        setValue(`orderProduct${index}`, item.productId);
        document.getElementById(`orderProduct${index}`).addEventListener('change', recalcOrder);
        document.getElementById(`orderQty${index}`).addEventListener('input', recalcOrder);
      });
      document.querySelectorAll('[data-remove-order-item]').forEach((button) => button.addEventListener('click', () => {
        const next = readOrderItems().filter((_, index) => index !== Number(button.dataset.removeOrderItem));
        renderOrderItems(next.length ? next : [{ productId: state.products[0]?.id, quantity: 1 }]);
      }));
      recalcOrder();
    }

    function readOrderItems() {
      return Array.from(document.querySelectorAll('[data-order-row]')).map((_, index) => ({
        productId: value(`orderProduct${index}`),
        quantity: Number(value(`orderQty${index}`) || 0)
      }));
    }

    function recalcOrder() {
      const customerId = value('orderCustomer');
      const total = readOrderItems().reduce((sum, item) => sum + priceFor(customerId, item.productId) * item.quantity, 0);
      document.getElementById('orderTotal').textContent = shekel(total);
    }

    function filterOrders() {
      const payment = value('orderPaymentFilter');
      const area = value('orderAreaFilter').toLowerCase();
      const date = value('orderDateFilter');
      const rows = state.orders.filter((order) => {
        const c = customer(order.customerId);
        const areaText = [c?.city, customerName(c), c?.address].join(' ').toLowerCase();
        return (!payment || order.paymentStatus === payment) && (!area || areaText.includes(area)) && (!date || order.deliveryDate === date);
      });
      document.getElementById('ordersTable').innerHTML = ordersTable(rows);
      bindOrderActionButtons();
    }

    function bindOrderActionButtons() {
      document.querySelectorAll('[data-pay-link]').forEach((button) => button.addEventListener('click', () => {
        const order = state.orders.find((item) => item.id === button.dataset.payLink);
        if (!order.paymentUrl) order.paymentUrl = `https://pay.example.test/orders/${order.id}`;
        navigator.clipboard?.writeText(order.paymentUrl);
        saveState('קישור תשלום דמו נוצר והועתק אם הדפדפן מאפשר');
      }));
      document.querySelectorAll('[data-mark-paid]').forEach((button) => button.addEventListener('click', () => {
        const order = state.orders.find((item) => item.id === button.dataset.markPaid);
        order.paymentStatus = 'paid_online';
        order.status = 'confirmed';
        saveState('הזמנה סומנה כשולמה');
      }));
      document.querySelectorAll('[data-delivered]').forEach((button) => button.addEventListener('click', () => {
        const order = state.orders.find((item) => item.id === button.dataset.delivered);
        order.status = 'delivered';
        saveState('הזמנה סומנה כסופקה');
      }));
    }

    function bindDeliveries() {
      const filter = document.getElementById('deliveryFilter');
      if (!filter) return;
      filter.addEventListener('input', () => {
        const q = filter.value.trim().toLowerCase();
        const rows = state.orders.filter((order) => {
          const c = customer(order.customerId);
          return [customerName(c), c?.city, c?.address].join(' ').toLowerCase().includes(q);
        });
        document.getElementById('deliveryList').innerHTML = deliveriesTable(rows);
        bindOrderActionButtons();
      });
    }

    function value(id) {
      return document.getElementById(id)?.value?.trim() || '';
    }

    function setValue(id, val) {
      const node = document.getElementById(id);
      if (node) node.value = val ?? '';
    }

    function upsert(list, item) {
      const index = list.findIndex((existing) => existing.id === item.id);
      if (index >= 0) list[index] = item;
      else list.push(item);
    }

    bindShell();
    render();
